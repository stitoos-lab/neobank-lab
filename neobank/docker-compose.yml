services:
  web :
    image : nginx:alpine
    volumes :
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks : [dmz, app]
    ports :
      - "127.0.0.1:8080:80"
    depends_on: [api]
  api :
    build : ./api
    environment :
      DB_HOST : db
      DB_NAME : neobank
      DB_USER : neobank
      DB_PASSWORD : ${DB_PASSWORD}
      JWT_SECRET : ${JWT_SECRET}
    networks : [app, data]
    depends_on: [db]
    volumes :
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    
  db :
    image : postgres:16-alpine
    environment :
      POSTGRES_DB : neobank
      POSTGRES_USER : neobank
      POSTGRES_PASSWORD : ${DB_PASSWORD}
    volumes :
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks : [data]

networks :
  dmz :
  app :
  data :
   internal: true

volumes:
  pgdata: